# 复制到真实业务项目根，与 AGENTS.md 和 aiotbot-knowledge-wifi-mp/ 同级。
# 本文件只声明真实映射；代码读取授权还须与内部 Agent 的受信配置一致。
schema_version: '2.0'
# 部署时改成该项目唯一且稳定的标识。
workspace_id: wifi-project
# 知识库保持与本 config 同级，目录名使用当前配套能力约定。
knowledge_roots:
  wifi: aiotbot-knowledge-wifi-mp
repos:
- repo_id: wifi-code
  kind: git
  # . 相对复制后的 config.yml 所在目录，即真实业务 Git 仓根。
  root: .
  # 代码入库核验前填真实 remote.origin.url，不能填示例地址。
  expected_identity: null
# 已知模块可细化此映射；默认覆盖同仓代码，不假定业务目录名。
architecture:
- binding_id: wifi-main
  repo_id: wifi-code
  module_root: .
  knowledge_domain: wifi
  override_nested: false
# 没有真实实体和符号映射时保持为空。
wiki_entities: {}
symbol_aliases: {}
# 以下是现有契约规定的六个逻辑 Target，并非已接入的产品声明。
# source_bindings 与 module_roots 按目标的真实来源绑定和模块路径补齐。
# 未知构建、宏和协议条件继续保持 null / []，不推断 Host/Device 配对兼容性。
targets:
- target_id: chip12-host
  chip: chip12
  side: host
  source_bindings: []
  module_roots: []
  build_profile: null
  required_features: []
  protocol_versions: []
- target_id: chip12-device
  chip: chip12
  side: device
  source_bindings: []
  module_roots: []
  build_profile: null
  required_features: []
  protocol_versions: []
- target_id: chip08-host
  chip: chip08
  side: host
  source_bindings: []
  module_roots: []
  build_profile: null
  required_features: []
  protocol_versions: []
- target_id: chip08-device
  chip: chip08
  side: device
  source_bindings: []
  module_roots: []
  build_profile: null
  required_features: []
  protocol_versions: []
- target_id: chip07c-host
  chip: chip07c
  side: host
  source_bindings: []
  module_roots: []
  build_profile: null
  required_features: []
  protocol_versions: []
- target_id: chip07c-device
  chip: chip07c
  side: device
  source_bindings: []
  module_roots: []
  build_profile: null
  required_features: []
  protocol_versions: []
pairs:
- pairing_id: chip12-host-device
  host_target: chip12-host
  device_target: chip12-device
  compatibility_policy: unknown
- pairing_id: chip08-host-device
  host_target: chip08-host
  device_target: chip08-device
  compatibility_policy: unknown
- pairing_id: chip07c-host-device
  host_target: chip07c-host
  device_target: chip07c-device
  compatibility_policy: unknown
# 日常默认读取本机已治理知识；shared 仅在内部共享接纳规则生效时使用。
query:
  default_channel: local
  allowed_channels:
  - local
  - shared

# 接代码捕获／核验时补实际授权，并与内部 Agent 受信侧 code_policy 完全一致。
# repo_roots 中须为实际获准的绝对路径；本模板保留未知，不预先授权任何目录。
code_policy: {}
