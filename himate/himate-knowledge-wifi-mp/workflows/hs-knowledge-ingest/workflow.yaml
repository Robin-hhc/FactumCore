version: 1
id: hs-knowledge-ingest
name: WiFi 知识入库
description: 在本次选定范围内逐批处理来源或PDF页段；P5成功回P1继续扫描，P1确认无待办才正常结束。
kind: custom
source: user_created
entry:
  skill: hs-knowledge-source
entry_node: prepare_sources
nodes:
- id: prepare_sources
  title: P1 选择文件并准备材料
  type: skill
  owner: coder
  skill: hs-knowledge-source
  prompt: '复用宿主绑定或本次已确认的知识根与执行端，读取该根的 AGENTS.md 和 config.yml。知识根或执行端仍不明确时询问用户。在数据所在端的知识根调用仓内 CLI，交接实际项目、知识根、执行端及已验证的 CLI 命令前缀（含指定解释器），后续节点沿用。

    首次进入交接本次任务的原始范围，后续各批保持：未指定来源时运行普通 scan，不把上一批 source_id 作为后续扫描范围；指定文件、目录或来源 ID 时每批采用该范围。沿用已验证的 CLI 命令前缀、parser 选项、review_text_budget 和 review_page_budget。用户明确要求重评时，reprocess: true 仅首次 P1 使用，后续普通续办。

    使用 hs-knowledge-source 扫描一个变化或待续办来源。有 task.pdf_review 时交接起点、宽候选及页索引，不默认读完整本或整个候选包。prepared 交 P2；unchanged 表示本次原始范围无待办，汇总各批实际处理的来源、页段和卡片变动后结束。'
  exits:
  - id: prepared
    label: 本轮材料已准备
    condition: 本次文件、来源 ID、hash 和关联卡入口已由脚本保存。
    target: plan_change
  - id: unchanged
    label: 没有待办
    condition: 本次任务原始范围扫描成功且没有待办，已汇总各批实际结果。
    target: __end__
- id: plan_change
  title: P2 阅读并制定编辑计划
  type: skill
  owner: coder
  skill: hs-knowledge-change-plan
  prompt: '使用 hs-knowledge-change-plan，读取 task、页索引和完整关联卡，完成六决策、新增主题查重及简短计划；不沿用前次问答主题作筛选。存在的 raw PDF 按需分段读宽候选，按自身上下文、图表、条款和产卡量自由选实际 end；80k token 仅作软目标，不要求读完候选。计划必填 source_pages 的单连续物理页区间，从 task 起点开始且不超过候选上限，完整评估选定范围。非 PDF 仍阅读全文，来源删除沿用原有判断。plan.md 的 YAML frontmatter 用 cards 固定完整候选 id/path；更新保留原路径和生命周期，标签或状态变化由 P2 决定；新卡按现有类型导航选目录，无候选写 cards: []。

    content_planned 交 P3；必要依据不足则 deferred，说明缺口并保留未完成文件，不推进成功 hash。本次任务因阻塞结束，交付已完成批次及当前来源仍未完成的事实，不宣称范围内待办已清空，也不回 P1 反复选中该来源。'
  exits:
  - id: content_planned
    label: 编辑计划已明确
    condition: 本轮 plan.md 已列明候选 id/path，并明确卡动作、结论变化、条件、依据和保留部分。
    target: materialize_view
  - id: deferred
    label: 本文件暂缓
    condition: 必要依据不足，已说明阻塞及实际已完成范围；本文件仍未完成，本次范围不宣称全部完成。
    target: __end__
- id: materialize_view
  title: P3 按计划写完整卡
  type: skill
  owner: coder
  skill: hs-knowledge-view-materialize
  prompt: '使用 hs-knowledge-view-materialize 按本轮计划 cards 的既定 id/path 和模板写完整候选卡；将 knowledge/ 前缀替换为 .build/cards/，不重选目录或给卡头增加 path。条件、依据和缺口写正文，正常更新时完整迁入旧结构知识并保留有效定位和锚点；明确旧卡去向与必须移除的文件。

    ready 交 P4；偏离计划的落位拼写在 P3 修正，计划决定需要改变才回 P2，同轮更新计划，不另建冻结轮次。'
  exits:
  - id: ready
    label: 完整候选稿已保存
    condition: 本轮 cards/ 和必要 changes.json 已完整表达最终改动，正式知识未修改。
    target: lint_view
  - id: needs_plan
    label: 调整编辑决定
    condition: 结论、归卡或旧结论去向需要重新判断。
    target: plan_change
- id: lint_view
  title: P4 检查并独立审阅
  type: skill
  owner: reviewer
  skill: hs-knowledge-review
  prompt: '由独立 reviewer 使用 hs-knowledge-review，沿用已交接的 CLI 先运行 ingest check，核对计划 cards 与候选 id/path，以及存在的 raw PDF 版本、source_pages 和候选边界。再独立阅读计划实际范围，对照旧卡与新稿核对事实、遗漏、旧知识保留、整卡退役及状态决定。PDF 完整评估实际页段，无须读完宽候选；非 PDF 检查全文，空候选也检查范围内新主题。补读前文、跨章和卡引用不自动计为覆盖。

    通过后交 P5；计划决定需改变回 P2、成稿或落位拼写问题回 P3，新稿重新审阅。不替作者改稿。'
  exits:
  - id: passed
    label: 检查与内容审阅通过
    condition: 脚本检查及独立内容审阅实际完成，无未解决必要问题。
    target: apply_view
  - id: needs_plan
    label: 重新判断内容
    condition: 事实、条件、依据或归卡决定需要作者重判。
    target: plan_change
  - id: needs_revision
    label: 修订稿件
    condition: 决定可保留，但表达、格式、定位、落位拼写或组稿需要修订。
    target: materialize_view
- id: apply_view
  title: P5 入库并更新索引
  type: skill
  owner: coder
  skill: hs-knowledge-apply
  prompt: '使用 hs-knowledge-apply 调用 ingest commit，机械核对本轮 PDF 页段后复制候选并刷新关系和检索索引，成功后合并本批已评估范围，仅全文覆盖时保存本文件成功 hash；不重复 P4 内容质量审阅。

    失败保留本轮暂存并直接重试 P5，不回 P1 清理。需要改稿时回 P3 再审。成功后简要交接 commit 回执中的来源、实际页段、卡片变动及剩余范围，source_complete 为 false 时明确 PDF 尚未完成；本批 completed 不代表本次任务或全文完成。

    本批成功后必须回 P1，按任务原始范围及已交接的解析和预算配置选择下一批，直到 P1 确认该范围无待办。上一批结果以 commit 回执为准，回 P1 后的 scan 用于选择下一批；不重复使用 reprocess: true。本节点不提交或推送 Git。'
  exits:
  - id: completed
    label: 本批已入库
    condition: 本轮卡片和索引更新成功，已保存本批处理事实，并按 source_complete 区分部分或全文完成。
    target: prepare_sources
artifacts:
  primary: []
  optional: []
