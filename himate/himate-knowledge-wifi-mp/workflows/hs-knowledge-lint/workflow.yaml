version: 1
id: hs-knowledge-lint
name: WiFi 知识治理巡检
description: 串行同步与发现raw/code变化及PDF续办，逐批复用P1-P5处理，最后报告剩余事项。
kind: custom
source: user_created
entry:
  skill: hs-knowledge-patrol-sync
entry_node: sync_workspace
nodes:
- id: sync_workspace
  title: L1 同步实际工作区
  type: skill
  owner: coder
  skill: hs-knowledge-patrol-sync
  prompt: '复用已知项目与执行端；否则读当前工作区 AGENTS.md、config.yml，确定知识根，位置不明确才询问用户。在数据所在端的原生知识根调用仓内 CLI，交接实际项目、知识根、执行端及已验证的 CLI 命令前缀（含指定解释器），后续节点沿用。

    使用 hs-knowledge-patrol-sync 采用明确配置的同步 argv/cwd；成功或未配置同步后进入 L2，新 CLI 加载同步后的实际实现。'
  exits:
  - id: synced
    label: 工作区同步完成
    condition: 配置的同步命令执行成功。
    target: plan_patrol
  - id: skipped
    label: 检查本地现状
    condition: 未配置同步，明确本轮检查本地文件。
    target: plan_patrol
- id: plan_patrol
  title: L2 选择原件或代码待办
  type: skill
  owner: coder
  skill: hs-knowledge-patrol-plan
  prompt: '使用 hs-knowledge-patrol-plan 取得一个待办；本步不创建 .build。

    needs_ingest 将 data.next_file.source_id 交 P1；仅索引问题交 L3；无待办交 L4。失败保留真实错误。'
  exits:
  - id: needs_ingest
    label: 处理来源待办
    condition: 返回真实 next_file，包含来源 ID、kind 和路径。
    target: prepare_sources
  - id: needs_reindex
    label: 刷新索引
    condition: 无内容待办，但正式卡与索引需要对齐。
    target: refresh_index
  - id: unchanged
    label: 本轮无新待办
    condition: 当前观察成功且没有待处理来源。
    target: complete_patrol
- id: prepare_sources
  title: P1 选择文件并准备材料
  type: skill
  owner: coder
  skill: hs-knowledge-source
  prompt: '复用已知项目与执行端；否则读当前工作区 AGENTS.md、config.yml，确定知识根，位置不明确才询问用户。在数据所在端的原生知识根调用仓内 CLI，交接实际项目、知识根、执行端及已验证的 CLI 命令前缀（含指定解释器），后续节点沿用。

    使用 hs-knowledge-source 调用 ingest scan --source 实际来源ID；完整采用本次 L2 选定的 raw 或 code 来源，不把该 ID 当作整轮巡检的范围，也不自行扫描其它来源。沿用已验证的 CLI 命令前缀、parser 选项、review_text_budget 和 review_page_budget，普通续办不使用 reprocess: true。有 task.pdf_review 时交接起点、宽候选及页索引，不默认读完整本或整个候选包。prepared 交 P2；unchanged 只表示 L2 本次选定来源无待办，回 L2 重新选择，由 L2 判断整轮是否无待办。'
  exits:
  - id: prepared
    label: 本轮材料已准备
    condition: 本次文件、来源 ID、hash 和关联卡入口已由脚本保存。
    target: plan_change
  - id: unchanged
    label: 没有待办
    condition: L2 本次选定来源扫描成功且没有待办，需由 L2 重新判断其余来源。
    target: plan_patrol
- id: plan_change
  title: P2 阅读并制定编辑计划
  type: skill
  owner: coder
  skill: hs-knowledge-change-plan
  prompt: '使用 hs-knowledge-change-plan，读取 task、页索引和完整关联卡，完成六决策、新增主题查重及简短计划；不沿用前次问答主题作筛选。存在的 raw PDF 按需分段读宽候选，按自身上下文、图表、条款和产卡量自由选实际 end；80k token 仅作软目标，不要求读完候选。计划必填 source_pages 的单连续物理页区间，从 task 起点开始且不超过候选上限，完整评估选定范围。非 PDF 仍阅读全文，来源删除沿用原有判断。plan.md 的 YAML frontmatter 用 cards 固定完整候选 id/path；更新保留原路径和生命周期，标签或状态变化由 P2 决定；新卡按现有类型导航选目录，无候选写 cards: []。

    content_planned 交 P3；必要依据不足则 deferred，说明缺口并保留未完成文件，不推进成功 hash。交 L4 汇总已完成批次和阻塞来源，不回 L2 反复选中同一来源，不宣称巡检待办已清空。'
  exits:
  - id: content_planned
    label: 编辑计划已明确
    condition: 本轮 plan.md 已列明候选 id/path，并明确卡动作、结论变化、条件、依据和保留部分。
    target: materialize_view
  - id: deferred
    label: 本文件暂缓
    condition: 必要依据不足，已说明阻塞；本文件仍未完成，交汇总报告实际剩余事项。
    target: complete_patrol
- id: materialize_view
  title: P3 按计划写完整卡
  type: skill
  owner: coder
  skill: hs-knowledge-view-materialize
  prompt: '使用 hs-knowledge-view-materialize 按本轮计划 cards 的既定 id/path 和模板写完整候选卡；将 knowledge/ 前缀替换为 .build/cards/，不重选目录或给卡头增加 path。条件、依据和缺口写正文，正常更新时完整迁入旧结构知识并保留有效定位和锚点；明确旧卡去向与必须移除的文件。

    ready 交 P4；偏离计划的落位拼写在 P3 修正，计划决定需要改变才回 P2，同轮更新计划，不另建冻结轮次。'
  exits:
  - id: ready
    label: 完整候选稿已保存
    condition: 本轮 cards/ 和必要 changes.json 已完整表达最终改动，正式知识未修改。
    target: lint_view
  - id: needs_plan
    label: 调整编辑决定
    condition: 结论、归卡或旧结论去向需要重新判断。
    target: plan_change
- id: lint_view
  title: P4 检查并独立审阅
  type: skill
  owner: reviewer
  skill: hs-knowledge-review
  prompt: '由独立 reviewer 使用 hs-knowledge-review，沿用已交接的 CLI 先运行 ingest check，核对计划 cards 与候选 id/path，以及存在的 raw PDF 版本、source_pages 和候选边界。再独立阅读计划实际范围，对照旧卡与新稿核对事实、遗漏、旧知识保留、整卡退役及状态决定。PDF 完整评估实际页段，无须读完宽候选；非 PDF 检查全文，空候选也检查范围内新主题。补读前文、跨章和卡引用不自动计为覆盖。

    通过后交 P5；计划决定需改变回 P2、成稿或落位拼写问题回 P3，新稿重新审阅。不替作者改稿。'
  exits:
  - id: passed
    label: 检查与内容审阅通过
    condition: 脚本检查及独立内容审阅实际完成，无未解决必要问题。
    target: apply_view
  - id: needs_plan
    label: 重新判断内容
    condition: 事实、条件、依据或归卡决定需要作者重判。
    target: plan_change
  - id: needs_revision
    label: 修订稿件
    condition: 决定可保留，但表达、格式、定位、落位拼写或组稿需要修订。
    target: materialize_view
- id: apply_view
  title: P5 入库并更新索引
  type: skill
  owner: coder
  skill: hs-knowledge-apply
  prompt: '使用 hs-knowledge-apply 调用 ingest commit，机械核对本轮 PDF 页段后复制候选并刷新关系和检索索引，成功后合并本批已评估范围，仅全文覆盖时保存本文件成功 hash；不重复 P4 内容质量审阅。

    失败保留本轮暂存并直接重试 P5，不回 P1 清理。需要改稿时回 P3 再审。成功后简要交接 commit 回执中的来源、实际页段、卡片变动及剩余范围，source_complete 为 false 时明确 PDF 尚未完成；本批 completed 不代表整轮巡检或全文完成。上一批结果以 commit 回执为准；本节点不提交或推送 Git。

    本批成功后回 L2，由 L2 选择下一来源再交 P1，沿用已交接的解析和预算配置，不直接按上一批 source_id 回 P1。同版本未完成 PDF 仍可被 L2 选中继续，普通续办不使用 reprocess: true；暂缓文件交 L4 报告，不立即反复入库。'
  exits:
  - id: completed
    label: 本批已入库
    condition: 本轮卡片和索引更新成功，已保存本批处理事实，并按 source_complete 区分部分或全文完成。
    target: plan_patrol
- id: refresh_index
  title: L3 刷新派生索引
  type: skill
  owner: coder
  skill: hs-knowledge-patrol-reindex
  prompt: 使用 hs-knowledge-patrol-reindex 重建正式卡的双向关系与检索索引；成功交 L4。索引维护不代替内容判断，不推进未处理来源的成功 hash。
  exits:
  - id: reindexed
    label: 索引已刷新
    condition: 实际索引更新成功。
    target: complete_patrol
- id: complete_patrol
  title: L4 汇总结果和剩余事项
  type: skill
  owner: coder
  skill: hs-knowledge-patrol-complete
  prompt: '使用 hs-knowledge-patrol-complete 汇总本轮实际结果及剩余待办。

    文件完成由各次 P5 登记，本步不另建全库成功水位；仍有欠账时据实说明。'
  exits:
  - id: completed
    label: 本轮统计完成
    condition: 已取得真实剩余事项统计，报告处理范围与未解决问题。
    target: __end__
artifacts:
  primary: []
  optional: []
