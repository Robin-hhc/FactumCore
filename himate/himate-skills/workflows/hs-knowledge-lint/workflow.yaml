version: 1
id: hs-knowledge-lint
name: 知识治理巡检
description: 同步并扫描知识库，分流文档入库、程序定位修复与独立审阅的语义维护，发布后汇总。
kind: custom
source: user_created
entry:
  skill: hs-knowledge-patrol-sync
entry_node: sync_workspace
nodes:
- id: sync_workspace
  title: L1 同步实际工作区
  type: skill
  owner: coder
  skill: hs-knowledge-patrol-sync
  prompt: |-
    复用宿主绑定或本次已确认的知识根与执行端，读取该根的 AGENTS.md 和 config.yml。当前节点提供 `knowledge_doctor` 时用它核对绑定。采用已确认的 CLI 方式时，在知识根显式传入 --knowledge-root 运行 doctor --json。命令找不到、启动入口有明确缺项或诊断仅表明缺运行依赖时，加载 hs-knowledge-setup，在同一执行端补齐并复查。确认实际知识根与 phase 为 ready 后继续原巡检任务。交接执行端、知识根、调用方式和 data.runtime_version。使用 CLI 时还需交接命令入口。
    后续节点沿用同一执行端、知识根、调用方式和版本。采用 Knowledge MCP 时使用当前节点提供的对应工具。缺少工具时报告工具名，按该节点的阻塞或失败出口交接。工具拒绝、失败或返回 blocked 时，按实际 phase、data 和 diagnostics 分流并报告。禁止用终端重复上述调用。采用 CLI 时使用已确认的入口。
    使用 hs-knowledge-patrol-sync。成功或未配置同步时交 L2，环境或同步阻塞时交 L8，说明实际缺口。
  exits:
  - id: synced
    label: 工作区同步完成
    condition: 配置的同步命令执行成功。
    target: plan_patrol
  - id: skipped
    label: 检查本地现状
    condition: 未配置同步，明确本轮检查本地文件。
    target: plan_patrol
  - id: blocked
    label: 同步或环境受阻
    condition: 已报告真实环境或同步错误，保留当前待办。
    target: complete_patrol
- id: plan_patrol
  title: L2 分流文档与关联卡维护
  type: skill
  owner: coder
  skill: hs-knowledge-patrol-plan
  prompt: |-
    使用 hs-knowledge-patrol-plan，按工具回执的 phase 分流。交接 data.next_file 的 source_id、kind、path、change 和 task_type，不自行改选来源或任务类型。
    needs_ingest 交 P1，needs_maintenance 交 L3。仅索引问题交 L7，无待办交 L8。观察失败交 blocked，不能当作无待办。
  exits:
  - id: needs_ingest
    label: 入库文档
    condition: 工具选定新建、修改或尚未完成的文档，任务类型为 document_ingest。
    target: prepare_sources
  - id: needs_maintenance
    label: 维护已有卡
    condition: 工具选定已引用代码或已删除文档的关联卡维护任务，任务类型为 card_maintenance。
    target: prepare_maintenance
  - id: needs_reindex
    label: 刷新索引
    condition: 无内容待办，但正式卡与派生索引需要对齐。
    target: refresh_index
  - id: unchanged
    label: 本轮无新待办
    condition: 当前观察成功，确认无来源或索引待办。
    target: complete_patrol
  - id: blocked
    label: 待办观察受阻
    condition: 已报告真实扫描错误，未宣称本轮无待办。
    target: complete_patrol
- id: prepare_sources
  title: P1 准备选定文档
  type: skill
  owner: coder
  skill: hs-knowledge-source
  prompt: |-
    使用 hs-knowledge-source，仅准备 L2 选定的文档 source_id，沿用解析配置和阅读预算。prepared 交接本批 task 及同版材料入口。blocked 向 L8 报告实际缺口，unchanged 回 L2 重新判断其余待办。
  exits:
  - id: prepared
    label: 文档材料已准备
    condition: 本次文档、来源 ID、hash 和关联旧卡入口已按工具回执保存。
    target: plan_change
  - id: unchanged
    label: 选定文档无待办
    condition: 选定文档扫描成功且无待办，尚未判断其余来源。
    target: plan_patrol
  - id: blocked
    label: 文档准备受阻
    condition: 已报告文档准备的具体错误或缺口，本来源仍待处理。
    target: complete_patrol
- id: plan_change
  title: P2 阅读文档并制定计划
  type: skill
  owner: coder
  skill: hs-knowledge-change-plan
  prompt: |-
    使用 hs-knowledge-change-plan，接收本批文档 task 和材料。content_planned 交接 .build/plan.md 与材料入口。deferred 向 L8 交接必要缺口、已完成批次及当前未完成文档。
  exits:
  - id: content_planned
    label: 文档编辑计划已明确
    condition: plan.md 已列明候选 id、path、required_code_refs，以及实际范围、卡动作、结论、条件、依据和保留部分。
    target: materialize_view
  - id: deferred
    label: 文档处理暂缓
    condition: 必要依据不足，已说明具体缺口，当前文档仍未完成。
    target: complete_patrol
- id: materialize_view
  title: P3 按文档计划写完整卡
  type: skill
  owner: coder
  skill: hs-knowledge-view-materialize
  prompt: |-
    使用 hs-knowledge-view-materialize，接收文档计划、材料及返工意见。ready 交接候选与适用的删除清单，needs_plan 交接需要重新判断的问题。
  exits:
  - id: ready
    label: 文档候选稿已保存
    condition: cards/ 和适用 changes.json 已完整表达本轮候选，正式知识未修改。
    target: lint_view
  - id: needs_plan
    label: 调整文档编辑决定
    condition: 结论、归卡或旧结论去向需要重新判断。
    target: plan_change
- id: lint_view
  title: P4 独立审阅文档候选
  type: skill
  owner: reviewer
  skill: hs-knowledge-review
  prompt: |-
    独立 reviewer 使用 hs-knowledge-review 审阅本批文档计划、来源及候选。passed 交接实际审阅结果，needs_plan 或 needs_revision 交接具体问题和依据，返工稿仍经过 P4。
  exits:
  - id: passed
    label: 文档检查与审阅通过
    condition: 工具检查及独立内容审阅实际完成，无未解决的必要问题。
    target: apply_view
  - id: needs_plan
    label: 重新判断文档内容
    condition: 事实、条件、依据或归卡决定需要作者重判。
    target: plan_change
  - id: needs_revision
    label: 修订文档候选
    condition: 决定可保留，但表达、格式、引用或组稿需要修订。
    target: materialize_view
- id: apply_view
  title: P5 发布文档批次
  type: skill
  owner: coder
  skill: hs-knowledge-apply
  prompt: |-
    收到 P4 通过结果后使用 hs-knowledge-apply。completed 交接实际文档 commit 回执，回 L2。可恢复执行错误走 retry，保留同批已审稿。确认尚未发布且需改稿时走 needs_revision，无法确认发布状态或本次无法恢复时走 failed，保留现场交 L8。
  exits:
  - id: completed
    label: 文档批次已发布
    condition: 文档批次、索引和实际阅读覆盖已登记，按 source_complete 区分部分或全文完成。
    target: plan_patrol
  - id: needs_revision
    label: 修订尚未发布的候选
    condition: 确认本批尚未写入正式库，需修改候选并重新通过 P4。
    target: materialize_view
  - id: retry
    label: 重试原文档批次
    condition: 执行问题可恢复，保留同一已审批次重试，不重新扫描。
    target: apply_view
  - id: failed
    label: 保留文档发布现场
    condition: 当前错误无法恢复或无法确认发布状态，已记录具体错误及未完成范围。
    target: complete_patrol
- id: prepare_maintenance
  title: L3 准备并分流引用维护
  type: skill
  owner: coder
  skill: hs-knowledge-patrol-prepare
  prompt: |-
    使用 hs-knowledge-patrol-prepare，接收 L2 的固定维护任务或本分支的重新备料请求。按工具实际 phase 分流：mechanical_prepared 交接 mode=mechanical 的固定任务、程序候选和机械检查入口，直接到 L6；prepared 将语义任务及实际引用状态、相关来源和证据入口交 L4。同一卡混合状态采用工具固定的语义任务，不自行降级。unchanged 回 L2，blocked 向 L8 报告实际缺口，保留待办。
  exits:
  - id: mechanical_prepared
    label: 程序定位修复已准备
    condition: 工具实际返回 mechanical_prepared，同批 mode=mechanical 的任务、受限候选和机械检查入口已固定。
    target: apply_maintenance
  - id: prepared
    label: 语义维护材料已固定
    condition: 工具实际返回 prepared，已固定需判断的引用、相关来源与已有卡范围。
    target: repair_cards
  - id: unchanged
    label: 选定维护任务已无待办
    condition: 观察成功且选定来源当前无维护待办。
    target: plan_patrol
  - id: blocked
    label: 维护材料缺失
    condition: 已报告实际备料错误或无法恢复的必要证据缺口。
    target: complete_patrol
- id: repair_cards
  title: L4 复核并修订已有卡
  type: skill
  owner: coder
  skill: hs-knowledge-patrol-repair
  prompt: |-
    使用 hs-knowledge-patrol-repair，仅处理 prepared 语义任务的固定已有卡和引用。结合 changed、unresolved 或 unversioned 状态及同卡相关来源复核；定位候选是材料，不是内容通过。修订或零正文改动决定均交 L5。ready 交接简短决定与必要候选，新主题仅作为待报告事项。可通过重备料解决的问题交 L3，无法恢复的必要证据缺口交 L8；不手写 evidence_version。
  exits:
  - id: ready
    label: 维护候选或零修改决定已保存
    condition: 已完成关联卡复核，保存必要候选及逐卡依据，未修改正式库。
    target: review_maintenance
  - id: needs_preparation
    label: 重新准备维护输入
    condition: 输入版本失效或材料可重新取得，需由 L3 固定新批次。
    target: prepare_maintenance
  - id: deferred
    label: 维护暂缓
    condition: 必要证据无法核实，已说明具体缺口并保留待办。
    target: complete_patrol
- id: review_maintenance
  title: L5 独立审阅维护结果
  type: skill
  owner: reviewer
  skill: hs-knowledge-patrol-review
  prompt: |-
    独立 reviewer 使用 hs-knowledge-patrol-review 审阅 prepared 语义任务，核对原卡、实际引用状态、相关来源、候选和范围。零正文改动也须独立核验；机械任务不在此伪造内容通过。passed 交接实际审阅结果，内容及候选问题回 L4，能通过重新备料解决的输入问题回 L3，必要证据无法恢复时交 L8，保留待办。
  exits:
  - id: passed
    label: 维护检查与独立审阅通过
    condition: 工具检查及逐卡独立审阅实际完成，无未解决的必要问题。
    target: apply_maintenance
  - id: needs_revision
    label: 修订关联卡维护结果
    condition: 结论、条件、引用、范围或候选需要作者修正。
    target: repair_cards
  - id: needs_preparation
    label: 重新固定维护输入
    condition: 输入版本失效或存在可通过重新备料解决的材料缺口。
    target: prepare_maintenance
  - id: deferred
    label: 保留维护证据缺口
    condition: 必要证据无法恢复或核实，不能给出通过结论。
    target: complete_patrol
- id: apply_maintenance
  title: L6 发布定位或语义维护
  type: skill
  owner: coder
  skill: hs-knowledge-patrol-apply
  prompt: |-
    使用 hs-knowledge-patrol-apply，按固定 task.mode 区分发布依据：mechanical 只采用 L3 实际 mechanical_prepared 任务及程序机械凭据；semantic 或旧任务缺省必须有真实 L5 通过。均由原 maintain commit 重验输入、范围和对应凭据，不手写 mode、marker 或 evidence_version，也不以机械检查冒充内容审阅。completed 据实际回执区分定位修复和语义维护，回 L2。retry 保留同批候选。确认未发布的语义候选需修订时回 L4；机械凭据/允许差异不成立或输入需重备料时回 L3。无法确认发布状态或当前无法恢复时交 failed，保留现场并由 L8 汇总。
  exits:
  - id: completed
    label: 关联卡维护已完成
    condition: 机械定位发布或经独立审阅的语义维护登记成功，回执报告实际卡片及引用处理结果。
    target: plan_patrol
  - id: needs_revision
    label: 修订尚未发布的维护候选
    condition: 确认本语义批次尚未写入正式库，需修改候选并重新通过 L5。
    target: repair_cards
  - id: needs_preparation
    label: 刷新尚未发布的维护输入
    condition: 确认本批尚未写入正式库，机械凭据/允许差异不成立，或来源及关联卡输入已失效，需重新备料。
    target: prepare_maintenance
  - id: retry
    label: 重试原维护批次
    condition: 执行问题可恢复，保留同一已审维护批次重试。
    target: apply_maintenance
  - id: failed
    label: 保留维护发布现场
    condition: 当前错误无法恢复或无法确认发布状态，已记录真实错误并保留现场。
    target: complete_patrol
- id: refresh_index
  title: L7 刷新派生索引
  type: skill
  owner: coder
  skill: hs-knowledge-patrol-reindex
  prompt: |-
    使用 hs-knowledge-patrol-reindex 刷新派生索引，成功回 L2 重新观察。失败交 L8，索引维护不代替内容复核或推进来源成功版本。
  exits:
  - id: reindexed
    label: 索引已刷新
    condition: 实际索引更新成功。
    target: plan_patrol
  - id: failed
    label: 索引刷新失败
    condition: 已报告实际索引更新错误。
    target: complete_patrol
- id: complete_patrol
  title: L8 汇总结果和剩余事项
  type: skill
  owner: coder
  skill: hs-knowledge-patrol-complete
  prompt: |-
    使用 hs-knowledge-patrol-complete，依据实际 P5、L6、L7 和统计回执汇总文档批次、程序定位修复、经独立审阅的语义维护、索引变动与剩余待办。机械发布不表述为 L5 内容通过。新主题说明仅报告未立卡，失败、暂缓和未知发布状态保留实际缺口，不宣称全部完成。
  exits:
  - id: completed
    label: 本轮统计完成
    condition: 已报告真实处理范围、完成结果及必要缺口。
    target: __end__
artifacts:
  primary: []
  optional: []
