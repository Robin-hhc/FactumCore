[project]
name = "hs-common-knowledge-framework"
version = "0.1.0"
requires-python = ">=3.12"
description = "Shared AIoTBot knowledge operations; independent initial implementation"

[tool.pytest.ini_options]
testpaths = ["skills/common/knowledge/_shared/tests"]
pythonpath = ["skills/common/knowledge"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
