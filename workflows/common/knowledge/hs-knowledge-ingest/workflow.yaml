version: 1
id: hs-knowledge-ingest
name: WiFi 知识入库
description: 一次处理一个变化来源；P2先决策、P3写卡、P4独立审阅，P5入库并更新文件hash。
kind: custom
source: user_created
entry:
  skill: hs-knowledge-source
entry_node: prepare_sources
nodes:
- id: prepare_sources
  title: P1 选择文件并准备材料
  type: skill
  owner: coder
  skill: hs-knowledge-source
  prompt: '复用已知项目与执行端；否则读当前工作区 AGENTS.md、config.yml，确定知识根，位置不明确才询问用户。在数据所在端的原生知识根调用仓内 CLI，交接实际项目、知识根、执行端及已验证的 CLI 命令前缀（含指定解释器），后续节点沿用。

    使用 hs-knowledge-source 扫描一个变化来源；巡检指定 source_id 时完整采用该 ID。prepared 交 P2，unchanged 结束本轮。'
  exits:
  - id: prepared
    label: 本轮材料已准备
    condition: 本次文件、来源 ID、hash 和关联卡入口已由脚本保存。
    target: plan_change
  - id: unchanged
    label: 没有待办
    condition: 本次所选范围扫描成功且没有待办。
    target: __end__
- id: plan_change
  title: P2 阅读并制定编辑计划
  type: skill
  owner: coder
  skill: hs-knowledge-change-plan
  prompt: '使用 hs-knowledge-change-plan 以本轮 task 的来源为范围阅读全文和关联卡，完成六决策、新增主题查重及简短计划；不沿用前次问答主题作筛选。plan.md 开头的 YAML frontmatter 用 cards 列出本轮完整候选的 id/path；更新保留原路径和原生命周期，标签或状态变化由 P2 明确决定；新卡按现有类型导航选目录，无候选写 cards: []。

    content_planned 交 P3；必要依据不足则 deferred，说明缺口并保留未完成文件，不推进成功 hash。'
  exits:
  - id: content_planned
    label: 编辑计划已明确
    condition: 本轮 plan.md 已列明候选 id/path，并明确卡动作、结论变化、条件、依据和保留部分。
    target: materialize_view
  - id: deferred
    label: 本文件暂缓
    condition: 必要依据不足，已说明缺口；本文件不标为处理完成。
    target: __end__
- id: materialize_view
  title: P3 按计划写完整卡
  type: skill
  owner: coder
  skill: hs-knowledge-view-materialize
  prompt: '使用 hs-knowledge-view-materialize 按本轮计划 cards 的既定 id/path 和模板写完整候选卡；将 knowledge/ 前缀替换为 .build/cards/，不重选目录或给卡头增加 path。条件、依据和缺口写正文，正常更新时完整迁入旧结构知识并保留有效定位和锚点；明确旧卡去向与必须移除的文件。

    ready 交 P4；偏离计划的落位拼写在 P3 修正，计划决定需要改变才回 P2，同轮更新计划，不另建冻结轮次。'
  exits:
  - id: ready
    label: 完整候选稿已保存
    condition: 本轮 cards/ 和必要 changes.json 已完整表达最终改动，正式知识未修改。
    target: lint_view
  - id: needs_plan
    label: 调整编辑决定
    condition: 结论、归卡或旧结论去向需要重新判断。
    target: plan_change
- id: lint_view
  title: P4 检查并独立审阅
  type: skill
  owner: reviewer
  skill: hs-knowledge-review
  prompt: '由独立 reviewer 使用 hs-knowledge-review，沿用已交接的 CLI 先运行 ingest check，由机器一一核对计划 cards 与候选 id/path，不另行推断路径类型；再独立阅读来源，对照计划、旧卡与新稿，核对旧知识保留、整卡退役及状态决定，空候选也检查全文新主题。

    通过后交 P5；计划决定需改变回 P2、成稿或落位拼写问题回 P3，新稿重新审阅。不替作者改稿。'
  exits:
  - id: passed
    label: 检查与内容审阅通过
    condition: 脚本检查及独立内容审阅实际完成，无未解决必要问题。
    target: apply_view
  - id: needs_plan
    label: 重新判断内容
    condition: 事实、条件、依据或归卡决定需要作者重判。
    target: plan_change
  - id: needs_revision
    label: 修订稿件
    condition: 决定可保留，但表达、格式、定位、落位拼写或组稿需要修订。
    target: materialize_view
- id: apply_view
  title: P5 入库并更新索引
  type: skill
  owner: coder
  skill: hs-knowledge-apply
  prompt: '使用 hs-knowledge-apply 调用 ingest commit，复制候选并刷新关系和检索索引，最后保存本文件成功 hash；不重复质量检查。

    失败保留本轮暂存并直接重试 P5，不回 P1 清理。需要改稿时回 P3 再审。成功以 commit 回执交付，不用 scan 验证；本节点不提交或推送 Git。'
  exits:
  - id: completed
    label: 本文件已入库
    condition: 本轮卡片和索引更新成功，触发文件处理标记已保存。
    target: __end__
artifacts:
  primary: []
  optional: []
