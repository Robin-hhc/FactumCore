    Inspect actual journal, locks, backups and final bytes. Resume or rollback only the original
    transaction. A recovered committed content batch continues unfinished indexing/query; recovered
    record-only completes local ingest immediately, preserving unresolved dispositions. Do not create
    duplicate knowledge or rewrite prior history.
  exits:
  - id: recovered
    label: recovered
    condition: Original content transaction actual state verified/applied.
    target: rebuild_index
  - id: record_only
    label: record only
    condition: Original record-only transaction recovered; local ingest is complete and its recorded pending work
      remains pending.
    target: __end__
  - id: rolled_back
    label: rolled back
    condition: Original transaction rolled back; new content preparation needed.
    target: prepare_material
