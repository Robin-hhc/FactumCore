    --action run with v3_required true and ingest_record_ref. Content also needs view_ref, final
    lint_report_ref/content_review_ref and the code proof_ref for code/mixed views, plus check_inputs
    identical to final lint fixed inputs (a code batch explicitly supplies code_checkout). For card
    updates, carry the same historical_card_objects mapping from the P2 retained card_digest/card_ref
    objects used by final lint; no prior Git commit or manual historical-file preparation is required.
    Rerun the actual fixed checks; caller claims do not replace these checks. Document admission uses
    the exact independent content_review_ref as its proof; no human event is required. Record-only omits
    view/proofs and contains no card/nav/lock writes. Recheck baseline and exact locally recoverable
    captured originals; update/revalidate only actual record apply facts in the same transaction.
    Portable source availability for other clones belongs to subsequent human publishing. Git
    submission, fixed CI and merge are subsequent human operations, not local completion prerequisites.
    Already committed local transaction must return existing result, never reapply.
