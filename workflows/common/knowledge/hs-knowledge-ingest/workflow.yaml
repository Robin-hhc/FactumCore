    --action review binds semantic_plan_ref and exact view_ref. Read actual full candidate, source and
    code evidence. Reuse unchanged assignment/skip adjudication, retain independent sampled/unreviewed
    scopes. Content defects return to P2/P3/P4. Emit content_review_ref for this exact view.

    On resume, the existence of a view or an inspect phase is not a content review. The independent
    reviewer reads the actual complete candidate/material/plan. Reuse a saved review only after
    confirming its exact view/source/rules bindings, sampled scope and absence of unresolved blockers;
    otherwise perform --action review and save the actual content_review_ref before choosing reviewed.
  exits:
  - id: reviewed
    label: reviewed
    condition: Independent content review passed for the exact view.
    target: lint_preflight
  - id: needs_material
    label: needs material
    condition: Missing material.
    target: prepare_material
  - id: needs_plan
    label: needs plan
    condition: Wrong Claim or card assignment.
    target: plan_change
  - id: needs_revision
    label: needs revision
    condition: Candidate structure/content needs revision.
    target: revise_candidate
- id: lint_preflight
  title: P4 Run fixed preflight before code checks
  type: skill
  owner: reviewer
  skill: hs-knowledge-lint
  prompt: |-
