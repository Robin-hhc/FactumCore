version: 1
id: hs-knowledge-ingest
name: hs-knowledge-ingest
description: 'One local raw-to-knowledge Workflow: scan, read, author/review, lint, record, apply and verify local
  queries; people submit, run CI and merge afterward.'
kind: custom
source: user_created
entry:
  skill: hs-knowledge-source-scan
entry_node: scan_sources
nodes:
- id: scan_sources
  title: P1 Scan raw changes and resume unfinished work
  type: skill
  owner: coder
  skill: hs-knowledge-source-scan
  prompt: |-
    OpenFlow owns node order, role isolation and transitions. Use the installed public Skill CLI
    with its business operation_id and actual inputs; do not add Workflow identities, manifests,
    catalog registration or upstream passed tickets to Skill requests. Reuse known AGENTS/config.yml
    context and the execution host global Python. Setup is outside ingest; do not repeat setup/E0.
    The harness resolves installed paths and any SSH connection, checks execution results and keeps
    one ingest writer. Originals and business code remain read-only. Resolve the actual knowledge
    root K from config.yml; keep requests, drafts, diagnostics and results in its existing locations.

    Read actual status/phase, diagnostics and exact business outputs; exit 0 alone is insufficient.
    Before retrying, recheck source/rules/code/baseline and the original transaction. Unchanged inputs
    may resume the same operation. Changed inputs or returned content require a new operation and
    newly bound scan/material/plan/view; never overwrite sealed old files or repeat committed apply.
    Honor user interruption. Allow at most three substantive revision attempts per batch; stop sooner
    when the same issue repeats without progress. This budget does not authorize environment retries.

    On missing indispensable material, invalid reports, runtime/SSH uncertainty or exhausted budget,
    save the actual input/output references, diagnostics and next action under K/.build/operations/.
    Record the stop using only resumeCapsule goal/done/currentFocus in the host-supported
    workflow_runtime_patch. Do not call workflow_handoff or emit a handoff a2a-callback when no
    exit condition is satisfied. End this turn with the unresolved reason and preserve the current
    node; do not patch currentNode/batonHolder/flowState/recoveryContext or create a retry loop.
    The retained Workflow is unfinished (active), not native waiting and never completed by failure.

    For each artifact duty actually required by the selected exit, write a separate Markdown summary
    of this CLI invocation and its original business references. Submit its exact artifact ID and
    explicit location {kind: markdown_file, path: <artifact-root-relative-file>} in workflowCompletion.
    Use K/.build/operations/<operation_id>/handoffs/<node_id>/<unique-attempt>/<artifact-id>.md,
    resolving K relative to the actual project root and allocating a new attempt for every invocation.
    These are resolved paths, not OpenFlow placeholder syntax. Never use a shared node-result.md or
    rely on Skill default_location.path; the official contract loader drops that default field.
    Use the host-rendered artifactLocationContext.projectRoot and any bound artifactRoots as
    the artifact validation base, which can differ from the business project root. Resolve the
    summary in K first, then submit its path relative to that actual validation base. Confirm
    containment, exact file identity and readability before handoff. If K is outside that root
    or bound scope, or the host does not expose a usable mapping, preserve this node and report
    the host artifact-root integration gap. Do not create another business directory under the
    OpenFlow installation, use escaping paths, or mistake a soft-record warning for saved evidence. If the execution
    host differs, retain original host/path identities and stop on unavailable artifact access.
    Summaries are pointers to actual Skill results, not fabricated success or replacement evidence.

    Context is already known: do not invoke E0, bind a project or initialize services. --action scan
    without source scans the five allowed raw directories. Optional source only narrows scope. Consume
    portable ingest history and inspect-context affected Claims; unchanged raw does not prove code
    validity. Resume recoverable transactions first. A draft made under older rules remains historical:
    create a new operation and obtain current independent content review rather than reusing old proofs.
    Other old terminal journals only establish writer liveness; they do not authorize current cards. A
    committed apply remains committed even if indexing failed. Under new rules explicitly include
    existing cards and originals, handle rules_changed maintenance units in P3/P6 and obtain new
    acceptance without rewriting old digests. Unchanged-completed units become scan_unchanged
    dispositions only when no user correction is requested. A user request to revise an existing card is
    actionable even when raw fingerprints are unchanged: route to P2 with explicit unit_ids for the
    relevant inventory units and candidate_card_ids for the requested cards; never take the unchanged
    shortcut. P2 then rereads those originals and existing cards for a new semantic plan. Never infer
    deletion from incomplete or partial scans.

    Before allocating a new batch, read the original operation through source-scan --action status
    and inspect its real journal/apply result, OpenFlow stop capsule and exact saved node outputs.
    Status alone does not report content review, index or query completion. Recover nonterminal writes
    first. For a valid uncommitted view, resume at independent review_content, never infer review from
    candidate-inspect phase. Check the saved content_review_ref against this exact view or review it.
    For committed content, verify actual applied files and retain the original operation/view/queries;
    only resume indexing or query/activation. Do not send an applied view to inspect or apply again.
    If sources/rules/code/content changed, prepare a new corrective operation instead of treating old
    terminal facts as current acceptance. For unchanged completed input with no unresolved batch,
    return no update; do not call record/apply or manufacture another logs/ingest processing record.
    First-time substantive skip/defer/failed observations still use scanned and the record-only path.
  exits:
  - id: scanned
    label: scanned
    condition: Inventory fixed, with actionable raw/code work or a user-requested card correction, including unchanged
      raw units.
    target: prepare_material
  - id: unchanged
    label: unchanged
    condition: A complete scan has only unchanged completed units (or no actionable input), no changed current context,
      user correction, unresolved transaction or unfinished indexing/query; report no update without a new processing
      record.
    target: __end__
  - id: resume
    label: resume
    condition: A still-valid complete view exists and has not been applied; resume independent content review before
      preflight/inspection.
    target: review_content
  - id: recover
    label: recover
    condition: An interrupted apply transaction exists.
    target: recover_transaction
  - id: resume_index
    label: resume local indexing
    condition: Original content transaction is committed and actual applied bytes remain valid; no usable verified
      candidate generation is saved. Continue only indexing under the original operation.
    target: rebuild_index
  - id: resume_queries
    label: resume queries or verify activation
    condition: Original content is committed and exact verified generation/expected_active/frozen cases are saved;
      finish query/activation, or verify a prior successful activation whose response was lost.
    target: query_regression
