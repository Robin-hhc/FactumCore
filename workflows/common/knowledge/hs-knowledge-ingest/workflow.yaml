    Load representative cases from the frozen plan/view; v3 content cannot accept a caller-supplied
    empty cases list. Verify expected cards/Claims and current-context filtering on the exact generation
    before activation. Pass generation_ref and expected_active exactly as returned by index-build; null
    is valid only when it returned no prior active pointer. Never overwrite a concurrently changed
    pointer. Verified activation completes local ingest; Git submission, fixed CI and merge are
    subsequent human operations and never prerequisites for this success. Runtime failure retries this
    finishing step; content error starts a new correction operation and preserves prior apply fact.

    If activation succeeded but its response was lost, do not replay activation with stale expected_active.
    Locate the saved passed regression report by the exact generation/view and original frozen cases;
    call query-regression --action verify with its report_ref and generation_ref, then reread the actual
    channel active pointer and confirm it still resolves to that same verified generation. Only this
    confirmed passed-and-active state selects checked. If no report or binding is available, preserve
    the stop; do not guess success. If the candidate is not active and the pointer still matches the
    original expected_active, run the normal regression/activation with those original inputs.
    A different active pointer is a concurrent-baseline conflict: stop without overwriting it.
    Never rebase expected_active onto a newly observed pointer merely to obtain activation success.
