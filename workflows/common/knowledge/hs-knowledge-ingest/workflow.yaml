version: 1
id: hs-knowledge-ingest
name: WiFi 知识入库
description: 七阶段增量入库；P5独立审阅和质量检查，P7安全落位及实际检索收尾。
kind: custom
source: user_created
entry:
  skill: hs-knowledge-source-scan
entry_node: scan_sources
nodes:
- id: scan_sources
  title: P1 扫描变化与续办
  type: skill
  owner: coder
  skill: hs-knowledge-source-scan
  prompt: 调用scan观察六类原件、共享处理历史、必要维护状态和本机停点，分别读actionable_unit_ids与finalization_pending。无变化且无义务才结束，不捕获材料或制造记录。已落位或有未完事务时，用只读status定位原操作，直接交P7续办，不重新提炼或apply；索引健康未检查不能当通过。消费副本不继承他人的私有恢复义务。异常无法核实事实时保存停点并保留宿主等待。
  exits:
  - id: scanned
    label: 准备材料
    condition: 有新增、变化、欠账、维护单元或明确修订目标。
    target: prepare_material
  - id: unchanged
    label: 无需更新
    condition: 扫描完整且无变化、修订、欠账或本机续办；不新增记录。
    target: __end__
  - id: recover
    label: 按原事务恢复
    condition: 已定位真实未结束写入事务，保持原操作及确切输入。
    target: apply_view
  - id: resume_index
    label: 续办索引
    condition: 原内容已落位，实际索引尚未完成。
    target: apply_view
  - id: resume_queries
    label: 续办查询和启用
    condition: 原内容已落位，有确切候选代或收尾事实需要续办。
    target: apply_view
- id: prepare_material
  title: P2 准备新旧材料
  type: skill
  owner: coder
  skill: hs-knowledge-source-prepare
  prompt: 调用独立prepare按固定扫描清单和所选单元准备真实原文、附件、采用旧版、关联旧卡和必要代码或配置。P5补料使用新operation_id，显式传previous_view_ref、revision_reason和旧稿绑定的existing_material_ref，只补明确缺口并保存新材料版本及前序摘要；保留原scan_ref和处理单元身份，不覆盖旧工件、不默认重扫全库。显式目标独立备料不冒称P1完整覆盖。只核所用输入；原观察范围或版本漂移时读取needs_scan和affected_scope，回P1更新真实清单。保留缺口，不代作者决定结论；纯环境故障保存停点。
  exits:
  - id: prepared
    label: 材料已保存
    condition: 实际材料、输入指纹及缺口已保存；不足可由P3决定记录欠账。
    target: plan_change
  - id: source_changed
    label: 更新扫描清单
    condition: 采用范围或观察版本已变，旧清单不能继续使用。
    target: scan_sources
- id: plan_change
  title: P3 阅读并决定内容
  type: skill
  owner: coder
  skill: hs-knowledge-change-plan
  prompt: 调用plan固定作者判断。逐单元确定content、skip、defer、failed或uncovered及理由，覆盖明确维护事项。判断卡和旧Claim的新建、更新、合并、拆分、退役或暂缓，保留身份和全部去向；同单元多种卡动作时显式record_action并保全明细。冻结本批查询及明确预期。P5退回或P2补料后，用新operation_id、previous_view_ref及revision_reason保存新计划；原scan及单元身份不变，采用旧材料须与前序稿精确绑定，补料须引用新材料版本，旧工件不覆盖。这里不做提前独立复核，不生产字节写入清单；缺材料回P2，采用源变化回P1。
  exits:
  - id: content_planned
    label: 作者判断已固定
    condition: 本批单元、卡和旧Claim处置及适用查询预期已保存。
    target: materialize_view
  - id: needs_material
    label: 补充材料
    condition: 需要补充本批原文、旧版或定位才能判断。
    target: prepare_material
- id: materialize_view
  title: P4 保存完整稿件
  type: skill
  owner: coder
  skill: hs-knowledge-view-materialize
  prompt: 调用run一次组织作者卡、导航、来源锁、写删集合、处置预览、展示字节及完整输入快照，读取实际输出，正式区不变。修订用新operation_id、previous_view_ref和revision_reason，通过同一入口保存新稿。仅退回P4时可明确采用前序稿精确绑定的未变semantic_plan和material；退回P2/P3时用它们的新版本。保留原scan及处理单元身份，核material_digest和previous_view_digest，新稿重新交P5；旧材料、计划、稿件和报告均不覆盖。相同操作重入读取已保存稿，不重新生成计划或导航，不跑整库质量lint。缺材料回P2，作者判断不清楚回P3，采用源变化回P1。
  exits:
  - id: ready
    label: 完整稿件已保存
    condition: 稿件、完整输入快照和处置预览已保存；记录批也有明确空写集。
    target: lint_view
  - id: needs_material
    label: 补充材料
    condition: 生成实际稿件所需原件、旧卡或必要材料缺失。
    target: prepare_material
  - id: needs_plan
    label: 完善作者判断
    condition: 卡动作、旧Claim去向或记录动作需要作者明确。
    target: plan_change
- id: lint_view
  title: P5 独立审阅与质量检查
  type: skill
  owner: reviewer
  skill: hs-knowledge-lint
  prompt: 由宿主安排独立reviewer任务，实际读原文、旧卡、作者计划、全部处置和稿件，审结论、归卡、实质skip及必要代码依据。调用action review，传view_ref、实际semantic_plan_ref、sampled_unit_ids、unreviewed_unit_ids、reason及明确findings；代码稿另传code_review的真实context和逐Claim材料。角色标签不认证独立性。正常候选一次完整固定lint；语义已阻断时记录未执行项。记录批只查处置和适用项，不建临时索引。读实际报告，披露抽样和未审范围；缺材料回P2、判断错回P3、稿件错回P4，并携确切previous_view_ref和理由交新操作返工，保留有效原scan、不覆盖旧工件，新稿必须重审。纯运行故障留本节点等待。
  exits:
  - id: passed
    label: 审阅和适用检查完成
    condition: 独立审阅实际完成，适用固定检查passed且范围明确，无未解决阻断。
    target: record_ingest
  - id: needs_material
    label: 补充审阅材料
    condition: 内容批缺必要原文、旧版、代码、配置或定位。
    target: prepare_material
  - id: needs_plan
    label: 重新判断内容
    condition: 结论、条件、归卡、旧Claim去向、实质skip或查询预期需重判。
    target: plan_change
  - id: needs_revision
    label: 修订稿件
    condition: 作者判断可保留，但正文、字段、来源登记、导航或组稿需改。
    target: materialize_view
- id: record_ingest
  title: P6 转写处理记录
  type: skill
  owner: coder
  skill: hs-knowledge-source-scan
  prompt: 调用record，消费实际view、disposition_preview与semantic_plan，机械转写已定单元决定、record_action、卡及Claim引用、理由、范围和欠账。返工记录使用新稿的operation_id，精确绑定原scan_ref、origin_scan_operation_id、材料和前序稿摘要，不伪造新扫描。不用dispositions覆盖既定判断，不重新决定新建或跳过。核新记录结构和确切绑定，保存待入库记录；正式记录及实际写入事实由P7落位。缺口原样保留，不提前声称Git提交、CI或合入。
  exits:
  - id: recorded
    label: 待入库记录已保存
    condition: 全部已定处置已完整转写，结构和确切业务输入绑定有效。
    target: apply_view
- id: apply_view
  title: P7 安全落位和检索收尾
  type: skill
  owner: coder
  skill: hs-knowledge-apply
  prompt: 调用action batch，传确切view、待入库记录及原冻结查询。核输入快照、原版本、写锁、未完事务、备份和实际回读；新入口保证安全落位和实际收尾，不重跑整库质量lint，不要求P5通过票据。原journal已committed时只核事实并续办尾部，不再apply。按持久停点和原expected_active继续索引、回归、启用；响应丢失先核原进程、journal、batch停点和实际指针。记录批只落记录，不建索引。实际batch_complete和适用启用事实齐全才结束；运行故障保留原停点，内容问题另建明确修订。输出本批精确文件清单，Git提交、CI及合入另行处理。
  exits:
  - id: completed
    label: 内容和检索收尾完成
    condition: 实际batch_complete为true，内容事务、确切索引、原查询及启用回读均完成。
    target: __end__
  - id: recorded
    label: 记录批已落位
    condition: record_only批安全落记录且batch_complete为true，没有构建或启用索引。
    target: __end__
artifacts:
  primary: []
  optional: []
