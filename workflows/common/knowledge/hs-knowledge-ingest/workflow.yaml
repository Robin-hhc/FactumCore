  - id: applied
    label: applied
    condition: Content transaction committed locally with actual record facts.
    target: rebuild_index
  - id: record_only
    label: record only
    condition: Valid processing record applied; local ingest is complete with unresolved dispositions preserved;
      indexing/query and Git are not required.
    target: __end__
  - id: recovery_required
    label: recovery required
    condition: Interrupted transaction; preserve exact original journal.
    target: recover_transaction
  - id: stale
    label: stale
    condition: Baseline or evidence changed before apply.
    target: prepare_material
- id: recover_transaction
  title: P7 Recover the existing transaction before new work
  type: skill
  owner: coder
  skill: hs-knowledge-recover
  prompt: |-
    OpenFlow owns node order, role isolation and transitions. Use the installed public Skill CLI
    with its business operation_id and actual inputs; do not add Workflow identities, manifests,
    catalog registration or upstream passed tickets to Skill requests. Reuse known AGENTS/config.yml
    context and the execution host global Python. Setup is outside ingest; do not repeat setup/E0.
