version: 1
id: hs-knowledge-ingest
name: WiFi 知识入库
description: 编排原件扫描、阅读计划、独立复核、检查及本地入库；索引、目标查询和活动代验证完成后结束。
kind: custom
source: user_created
entry:
  skill: hs-knowledge-source-scan
entry_node: scan_sources
nodes:
  - id: scan_sources
    title: P1 扫描原件与续办
    type: skill
    owner: coder
    skill: hs-knowledge-source-scan
    prompt: 扫描六类原件及实际停点，区分新处理、未入库复核和已入库收尾；无变化不写记录。先核宿主产物根，摘要用独立显式路径；不兼容或阻断时保存停点，不交棒。
    exits:
      - id: scanned
        label: 准备材料
        condition: 有新增、变化、未完成事项或用户修订请求。
        target: prepare_material
      - id: unchanged
        label: 无需更新
        condition: 扫描完整且无变化、修订、维护或未完成事项；不新增处理记录。
        target: __end__
      - id: resume
        label: 续办内容复核
        condition: 完整视图仍有效且尚未入库，先确认独立内容复核。
        target: review_content
      - id: recover
        label: 恢复事务
        condition: 存在未结束的写入事务。
        target: recover_transaction
      - id: resume_index
        label: 续办索引
        condition: 原事务已本地落位、文件仍有效，但候选索引尚未完整验证。
        target: rebuild_index
      - id: resume_queries
        label: 续办查询
        condition: 原事务已本地落位，已有确切候选代、冻结查询和活动指针基线。
        target: query_regression
  - id: prepare_material
    title: P2 准备新旧材料
    type: skill
    owner: coder
    skill: hs-knowledge-source-scan
    prompt: 准备本次原文、采用旧版、关联旧卡及代码材料，保留旧卡确切字节。输入变化时新建操作并重扫；摘要用独立显式路径，材料缺失或异常时保存停点，不交棒。
    exits:
      - id: prepared
        label: 材料就绪
        condition: 新旧材料及明确缺口已保存。
        target: plan_change
  - id: plan_change
    title: P3 阅读并制定计划
    type: skill
    owner: coder
    skill: hs-knowledge-change-plan
    prompt: 逐条对照事实、条件和证据，冻结六决策计划及查询预期，覆盖原件和维护单元。输入变化时先按新操作准备材料；摘要用独立显式路径，阻断时保留停点、不交棒。
    exits:
      - id: planned
        label: 计划就绪
        condition: 语义计划、来源处理判断和查询预期已固定。
        target: review_plan
      - id: needs_material
        label: 补充材料
        condition: 材料或定位需补充，且可在当前范围内继续处理。
        target: prepare_material
  - id: review_plan
    title: P3 独立复核归卡与跳过
    type: skill
    owner: reviewer
    skill: hs-knowledge-change-plan
    prompt: 独立审查归卡和实质跳过，注明样本、问题与未审范围；未选项不冒称通过。摘要用独立显式路径；缺材料或异常时保存停点，不交棒。
    exits:
      - id: reviewed
        label: 复核通过
        condition: 本次范围的独立复核通过，没有未解决的阻断项。
        target: materialize_view
      - id: record_only
        label: 仅处理记录
        condition: 复核已记录，仅有跳过、暂缓、失败或未覆盖事项。
        target: record_ingest
      - id: needs_material
        label: 补充材料
        condition: 材料或定位需补充，且可在当前范围内继续处理。
        target: prepare_material
      - id: needs_revision
        label: 修订计划
        condition: 归卡、结论或计划决策需要重判。
        target: plan_change
  - id: materialize_view
    title: P4 保存完整候选
    type: skill
    owner: coder
    skill: hs-knowledge-view-materialize
    prompt: 按计划撰写候选卡，固定导航、来源锁、基线和查询预期；显式传本次context_ref，代码上下文不继承旧视图。摘要用独立显式路径；阻断时保留停点、不交棒。
    exits:
      - id: ready
        label: 候选就绪
        condition: 新计划和完整视图已固定。
        target: review_content
      - id: stale
        label: 重新准备材料
        condition: 原件、规则、代码或基线变化，需按新操作准备材料。
        target: prepare_material
  - id: review_content
    title: P4 独立内容复核
    type: skill
    owner: reviewer
    skill: hs-knowledge-change-plan
    prompt: 独立阅读完整候选、原文和计划，复核断言、条件及融合关系；续办须确认复核绑定确切视图。摘要用独立显式路径；阻断时保留停点、不交棒。
    exits:
      - id: reviewed
        label: 复核通过
        condition: 本次范围的独立复核通过，没有未解决的阻断项。
        target: lint_preflight
      - id: needs_material
        label: 补充材料
        condition: 材料或定位需补充，且可在当前范围内继续处理。
        target: prepare_material
      - id: needs_plan
        label: 修订计划
        condition: 结论、适用范围或归卡关系需要重判。
        target: plan_change
      - id: needs_revision
        label: 修订候选
        condition: 候选内容、结构或导航需要修订。
        target: revise_candidate
  - id: lint_preflight
    title: P4 固定预检
    type: skill
    owner: reviewer
    skill: hs-knowledge-lint
    prompt: 对已独立复核的完整候选做固定预检，读取实际报告；材料、语义、格式问题分别返回补充材料、计划或修稿。摘要用独立显式路径；异常时保存停点、不交棒。
    exits:
      - id: passed
        label: 检查通过
        condition: 本次确切视图的必需检查已完整执行并通过。
        target: inspect_candidate
      - id: needs_material
        label: 补充材料
        condition: 材料或定位需补充，且可在当前范围内继续处理。
        target: prepare_material
      - id: needs_plan
        label: 修订计划
        condition: 结论、适用范围或归卡关系需要重判。
        target: plan_change
      - id: needs_revision
        label: 修订候选
        condition: 候选内容、结构或导航需要修订。
        target: revise_candidate
  - id: inspect_candidate
    title: P4 分类与事务检查
    type: skill
    owner: coder
    skill: hs-knowledge-candidate-inspect
    prompt: 核对确切视图和事务，区分文档、代码及混合稿；分类不代表内容复核，已入库不得重查旧基线。摘要用独立显式路径；阻断时保留停点、不交棒。
    exits:
      - id: manual_ready
        label: 文档稿就绪
        condition: 确切文档稿已有独立内容复核，可进入最终检查。
        target: lint_view
      - id: mixed_ready
        label: 混合稿就绪
        condition: 确切混合稿已有独立内容复核，继续代码部分核验。
        target: local_check
      - id: code_ready
        label: 代码稿就绪
        condition: 确切代码稿已有独立内容复核，继续代码核验。
        target: local_check
      - id: recovery_required
        label: 恢复事务
        condition: 存在需恢复的未完成写入事务。
        target: recover_transaction
      - id: needs_revision
        label: 修订候选
        condition: 候选内容、结构或导航需要修订。
        target: revise_candidate
  - id: local_check
    title: P4 独立代码核验
    type: skill
    owner: reviewer
    skill: hs-knowledge-local-check
    prompt: 独立逐Claim核对实际源码、配置、理由和引用，保存与本视图绑定的依据；角色和上下文隔离由宿主负责。摘要用独立显式路径；阻断时保存停点、不交棒。
    exits:
      - id: code_passed
        label: 代码核验通过
        condition: 逐Claim代码依据、条件及本次内容绑定核验通过。
        target: lint_view
      - id: needs_revision
        label: 修订候选
        condition: 候选内容、结构或导航需要修订。
        target: revise_candidate
  - id: revise_candidate
    title: P4 修订候选
    type: skill
    owner: coder
    skill: hs-knowledge-candidate-revise
    prompt: 新建操作，依次扫描、准备材料、重作语义计划，再携新context_ref修订原视图并重新复核。最多三轮，无进展即停；摘要用独立显式路径，阻断时保留停点、不交棒。
    exits:
      - id: ready
        label: 候选就绪
        condition: 新计划和完整视图已固定。
        target: review_content
      - id: needs_material
        label: 补充材料
        condition: 材料或定位需补充，且可在当前范围内继续处理。
        target: prepare_material
      - id: needs_plan
        label: 修订计划
        condition: 结论、适用范围或归卡关系需要重判。
        target: plan_change
      - id: deferred
        label: 登记暂缓
        condition: 只剩明确暂缓、失败或未覆盖事项，不写失败稿件。
        target: record_ingest
  - id: lint_view
    title: P5 最终完整检查
    type: skill
    owner: reviewer
    skill: hs-knowledge-lint
    prompt: 检查最终完整视图，带入材料阶段保留的旧卡正文；仅完整全库报告通过才登记，失败按问题返回。摘要用独立显式路径；运行故障保留停点、不交棒。
    exits:
      - id: passed
        label: 检查通过
        condition: 最终确切视图的完整全库报告通过。
        target: record_ingest
      - id: needs_material
        label: 补充材料
        condition: 材料或定位需补充，且可在当前范围内继续处理。
        target: prepare_material
      - id: needs_plan
        label: 修订计划
        condition: 结论、适用范围或归卡关系需要重判。
        target: plan_change
      - id: needs_revision
        label: 修订候选
        condition: 候选内容、结构或导航需要修订。
        target: revise_candidate
  - id: record_ingest
    title: P6 登记处理记录
    type: skill
    owner: coder
    skill: hs-knowledge-source-scan
    prompt: 对账来源、维护单元、卡和真实处理结果，生成待入库记录；仅记录批不得夹带失败稿件。摘要用独立显式路径；阻断或重复错误无进展时保存停点，不交棒。
    exits:
      - id: recorded
        label: 记录就绪
        condition: 记录覆盖、结构和内容绑定已校验，可同批落位。
        target: apply_view
      - id: needs_record
        label: 修正记录
        condition: 记录自身可修正，仍有预算且未重复同错。
        target: record_ingest
  - id: apply_view
    title: P7 本地入库
    type: skill
    owner: coder
    skill: hs-knowledge-apply
    prompt: 将卡、导航、来源锁和记录同批落位，重跑固定检查；保留历史卡输入，已落位事务不得重复写入。摘要用独立显式路径；异常先核事务，保存停点、不交棒。
    exits:
      - id: applied
        label: 入库完成
        condition: 内容与记录已同批提交到本地，继续检索收尾。
        target: rebuild_index
      - id: record_only
        label: 仅处理记录
        condition: 合法记录批已保存，未解决事项仍保留；无需索引。
        target: __end__
      - id: recovery_required
        label: 恢复事务
        condition: 存在需恢复的未完成写入事务。
        target: recover_transaction
      - id: stale
        label: 重新准备材料
        condition: 原件、规则、代码或基线变化，需按新操作准备材料。
        target: prepare_material
  - id: recover_transaction
    title: P7 恢复原事务
    type: skill
    owner: coder
    skill: hs-knowledge-recover
    prompt: 核对原事务、备份和实际文件，恢复或回滚；内容批只继续检索收尾，记录批保存后结束。摘要用独立显式路径；恢复不明时保存停点、不交棒。
    exits:
      - id: recovered
        label: 事务已恢复
        condition: 原内容事务已恢复并核实，只继续检索收尾。
        target: rebuild_index
      - id: record_only
        label: 仅处理记录
        condition: 原记录批已恢复并保存，未解决事项仍保留。
        target: __end__
      - id: rolled_back
        label: 事务已回滚
        condition: 原事务已安全回滚，重新准备材料。
        target: prepare_material
  - id: rebuild_index
    title: P7 构建并验证索引
    type: skill
    owner: coder
    skill: hs-knowledge-index-build
    prompt: 构建并完整验证本地索引，原样保存代次及活动指针基线；运行故障只重试收尾，内容错误新建修订。摘要用独立显式路径；异常时保存停点、不交棒。
    exits:
      - id: built
        label: 索引已验证
        condition: 实际候选索引已构建并完整验证。
        target: query_regression
      - id: content_error
        label: 新建内容修订
        condition: 确认内容有误，保留已入库事实并新建修订操作。
        target: prepare_material
  - id: query_regression
    title: P7 查询回归与激活
    type: skill
    owner: reviewer
    skill: hs-knowledge-query-regression
    prompt: 沿用冻结查询及构建返回的代次、活动指针基线，验证后CAS激活；响应丢失先核报告和实际活动代，不重放或改基线。摘要用独立显式路径；异常保存停点、不交棒。
    exits:
      - id: checked
        label: 查询与激活完成
        condition: 冻结查询通过且确切代已激活；丢失响应须先复验报告和实际活动代。
        target: __end__
      - id: content_error
        label: 新建内容修订
        condition: 确认内容有误，保留已入库事实并新建修订操作。
        target: prepare_material
artifacts:
  primary: []
  optional: []
