    --action prepare binds scan_ref. Rebuild source/Claim relations across all card states,
    topic/entity/interface/symbol search and explicit requires/derived_from dependencies. Ordinary
    related links do not expand. Return material_ref with current combined bundle, per-card adopted old
    originals, full old cards, diffs, reasons and gaps. For affected code Claims capture actual current
    code/Target/config through the public source-capture code action, using a separate child
    operation_id for each code source (never the batch ID, and no forwarded workflow object). Pass
    explicit code_bundle_refs [{bundle_ref,bundle_digest}] to prepare under the batch operation. In a
    code_root/modules workspace the fixed scripts use the configured relative file scope. Optional
    version labels must be backed by explicit material with its original content and provenance;
    preserve the observed label type and leave unsupported identity or state unknown. Bind the original
    config and actual file hashes, retain unknown version when no material supplies it, and preserve
    current code bytes beside adopted old sources. Never substitute historical code for current
    material. New concepts found later return here; no hit never proves a new card is needed.

    If this return changes previously sealed material or semantic decisions, allocate a new business
    operation_id. First call source-scan --action scan with the original raw scope and feedback,
    then --action prepare with the new scan_ref and explicit affected units/cards/code bundles.
    Use only that operation's new material_ref/scan_ref for the new semantic plan. Preserve the old
    view and applied facts; do not rename an old scan/material/plan into the new operation.
  exits:
  - id: prepared
    label: prepared
    condition: Material package and its explicit gaps are recorded.
    target: plan_change
- id: plan_change
  title: P3 Read each Claim and freeze semantic decisions
  type: skill
  owner: coder
  skill: hs-knowledge-change-plan
  prompt: |-
