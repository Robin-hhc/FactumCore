    one ingest writer. Originals and business code remain read-only. Resolve the actual knowledge
    root K from config.yml; keep requests, drafts, diagnostics and results in its existing locations.

    Read actual status/phase, diagnostics and exact business outputs; exit 0 alone is insufficient.
    Before retrying, recheck source/rules/code/baseline and the original transaction. Unchanged inputs
    may resume the same operation. Changed inputs or returned content require a new operation and
    newly bound scan/material/plan/view; never overwrite sealed old files or repeat committed apply.
    Honor user interruption. Allow at most three substantive revision attempts per batch; stop sooner
    when the same issue repeats without progress. This budget does not authorize environment retries.

    On missing indispensable material, invalid reports, runtime/SSH uncertainty or exhausted budget,
    save the actual input/output references, diagnostics and next action under K/.build/operations/.
