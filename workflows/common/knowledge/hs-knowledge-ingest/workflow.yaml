    Author the complete candidate cards under .build. First use change-plan run with v3_required true,
    semantic_plan_ref/material_ref and decisions/card_inputs, then materialize its plan_ref. Include
    exact card/navigation/source-lock writes/deletes, baselines and target queries; do not write formal
    knowledge or originals. Preserve source facts and include only portable exact source recovery for
    publication.

    For change-plan run, pass an explicit context_ref from the freshly verified current material
    combined bundle/configuration (null only for a document-only view). Do not inherit a previous view
    context when code or configuration changed; resolve ambiguous code contexts before creating the view.
  exits:
  - id: ready
    label: ready
    condition: Complete fixed view exists.
    target: review_content
  - id: stale
    label: stale
    condition: Source/baseline changed; rebuild materials and plan.
    target: prepare_material
- id: review_content
  title: P4 Independently review the exact complete candidate
  type: skill
  owner: reviewer
  skill: hs-knowledge-change-plan
  prompt: |-
