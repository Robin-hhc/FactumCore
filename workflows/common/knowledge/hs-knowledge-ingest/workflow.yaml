    --action plan reads scan_ref/material_ref and complete current/old originals and old cards. Compare
    facts, conditions and evidence per Claim, then aggregate six card decisions; source skip is
    separate. Cover raw units exactly. Separately provide maintenance_units for
    scan.current_context.affected_claims, with unit_id maintenance:<card_id>#<claim_id>, card_id,
    claim_id, outcome and reason; Claim/card.unit_ids may refer to these without inventing raw files.
    This also supports code-only changes with an empty raw list. Single writer per target card; fuse
    multi-source evidence. Missing material returns P2 or defer. Emit semantic_plan_ref and
    target_queries cases [{id,query,purpose,required,forbidden?,context?,expected_claim_ids?}].
    Explicitly choose purpose for every new case. Use guidance for design/specification background,
    historical for fixed old versions, current or implementation only with the corresponding current
    evidence and scope. An omitted purpose keeps the API's current default; it never includes guidance-
    only Claims. Never treat doc design declarations as implemented-code proof.

    If this return changes previously sealed material or semantic decisions, allocate a new business
    operation_id. First call source-scan --action scan with the original raw scope and feedback,
    then --action prepare with the new scan_ref and explicit affected units/cards/code bundles.
    Use only that operation's new material_ref/scan_ref for the new semantic plan. Preserve the old
    view and applied facts; do not rename an old scan/material/plan into the new operation.
  exits:
  - id: planned
    label: planned
    condition: 'Phase content_planned: semantic plan and source dispositions are sealed.'
    target: review_plan
  - id: needs_material
    label: needs material
    condition: Further original/card/code context needed.
    target: prepare_material
- id: review_plan
  title: P3 Independently sample skip and new/update assignment
  type: skill
  owner: reviewer
  skill: hs-knowledge-change-plan
  prompt: |-
