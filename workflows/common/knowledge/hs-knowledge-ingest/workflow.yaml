    --action review with semantic_plan_ref, separate reviewer_id, independent_context, sampled_unit_ids,
    unreviewed_unit_ids, reason and evidence findings. Independently read selected originals/old
    cards/plan; cover substantive skip and new/update risk. Unselected scope is recorded, never
    reviewed-pass. Omission or wrong assignment returns P2/P3; evidence shortage is defer. P1 scan-only
    skips need no semantic re-review.
  exits:
  - id: reviewed
    label: reviewed
    condition: Review passed and content changes are planned.
    target: materialize_view
  - id: record_only
    label: record only
    condition: Review recorded and only skip/defer/failed/uncovered dispositions remain; no failed card is forwarded.
    target: record_ingest
  - id: needs_material
    label: needs material
    condition: Review requires supplementary materials.
    target: prepare_material
  - id: needs_revision
    label: needs revision
    condition: Assignment or Claim decisions need revision.
    target: plan_change
- id: materialize_view
  title: P4 Author and freeze the complete proposed view
  type: skill
  owner: coder
  skill: hs-knowledge-view-materialize
  prompt: |-
