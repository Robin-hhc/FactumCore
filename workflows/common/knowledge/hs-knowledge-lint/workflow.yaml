version: 1
id: hs-knowledge-lint
name: hs-knowledge-lint
description: WiFi knowledge human or code governance to local publication handoff. Blocked exits end with a gap,
  never successful knowledge approval.
kind: custom
source: user_created
entry:
  skill: hs-workspace-explore
entry_node: bind_project
nodes:
- id: bind_project
  title: Bind workspace and load trusted context
  type: skill
  owner: coder
  skill: hs-workspace-explore
  prompt: Use only the installed trusted catalog public CLI. Pass explicit operation_id and workflow run_id/node_id/attempt_id.
    Check ResultEnvelope status and phase and the actual immutable result JSON/Markdown manifest bindings; process
    exit 0 alone is not success. On every loop allocate a fresh attempt_id; changed content requires a new operation/view
    and approval. Do not forward the workflow object to helper Skills. Stop on errors or unresolved prerequisites,
    report a gap without claiming completion. Read the user supplied target_path, config and private registry. resolved
    is insufficient; never scan the disk or infer unknown Target data.
  exits:
  - id: bound
    label: bound
    condition: status ok, phase context_loaded, actual context_ref and matching project/rules identity verified.
    target: inspect_candidate
  - id: blocked
    label: blocked
    condition: 'Missing prerequisites or status blocked/error: end this attempt with an unresolved gap; no success,
      approval or publish claim.'
    target: __end__
- id: inspect_candidate
  title: Inspect candidate and choose evidence path
  type: skill
  owner: coder
  skill: hs-knowledge-candidate-inspect
  prompt: Use only the installed trusted catalog public CLI. Pass explicit operation_id and workflow run_id/node_id/attempt_id.
    Check ResultEnvelope status and phase and the actual immutable result JSON/Markdown manifest bindings; process
    exit 0 alone is not success. On every loop allocate a fresh attempt_id; changed content requires a new operation/view
    and approval. Do not forward the workflow object to helper Skills. Stop on errors or unresolved prerequisites,
    report a gap without claiming completion. Technical structure/source/view validation applies to both modes.
    Pure documents never enter local-check or merge-check.
  exits:
  - id: manual_ready
    label: manual ready
    condition: Validated final_view review_mode manual_document; no code support claim is disguised as pure documentation.
    target: prepare_confirmation
  - id: code_ready
    label: code ready
    condition: Validated final_view review_mode code_gate with explicit code context.
    target: local_check
  - id: recovery_required
    label: recovery required
    condition: Nonterminal transaction journal requires recovery before any new apply.
    target: recover_transaction
  - id: needs_revision
    label: needs revision
    condition: Invalid or incomplete candidate can be explicitly revised.
    target: revise_candidate
  - id: blocked
    label: blocked
    condition: 'Missing prerequisites or status blocked/error: end this attempt with an unresolved gap; no success,
      approval or publish claim.'
    target: __end__
- id: prepare_confirmation
  title: Prepare complete display and fresh challenge
  type: skill
  owner: coder
  skill: hs-knowledge-confirmation-prepare
  prompt: Use only the installed trusted catalog public CLI. Pass explicit operation_id and workflow run_id/node_id/attempt_id.
    Check ResultEnvelope status and phase and the actual immutable result JSON/Markdown manifest bindings; process
    exit 0 alone is not success. On every loop allocate a fresh attempt_id; changed content requires a new operation/view
    and approval. Do not forward the workflow object to helper Skills. Stop on errors or unresolved prerequisites,
    report a gap without claiming completion. Display all writes/deletes/card/navigation/lock bytes and their exact
    bindings. Do not create manual_review or manufacture consent. Map only the actual CLI phase/data described by
    each exit condition; exit IDs are Workflow routing names, not invented ResultEnvelope phases.
  exits:
  - id: await_user
    label: await user
    condition: status ok, phase awaiting_human and actual display_ref/challenge exist for the complete exact view.
      This is no approval.
    target: final_view_user_gate
  - id: stale
    label: stale
    condition: 'View, source, baseline or rules changed: inspect the new view.'
    target: inspect_candidate
  - id: blocked
    label: blocked
    condition: 'Missing prerequisites or status blocked/error: end this attempt with an unresolved gap; no success,
      approval or publish claim.'
    target: __end__
- id: final_view_user_gate
  title: Real human confirms the complete exact final view
  type: gate
  owner: user
  prompt: 'Wait for a real human action on the exact prepared display. No response, timeout, Agent response or model
    score is not consent. Gate pass alone is not a proof: record_confirmation must authenticate the original host
    event and bindings. Changed or partially accepted content requires a new operation/view/display.'
  pass_label: Confirm the complete displayed view
  fail_label: Return for revision
  note_label: Display receipt identifier and optional human review note
  note_required: true
  on_pass: record_confirmation
  on_fail: revise_candidate
- id: record_confirmation
  title: Authenticate the original human event
  type: skill
  owner: coder
  skill: hs-knowledge-confirmation-record
  prompt: Use only the installed trusted catalog public CLI. Pass explicit operation_id and workflow run_id/node_id/attempt_id.
    Check ResultEnvelope status and phase and the actual immutable result JSON/Markdown manifest bindings; process
    exit 0 alone is not success. On every loop allocate a fresh attempt_id; changed content requires a new operation/view
    and approval. Do not forward the workflow object to helper Skills. Stop on errors or unresolved prerequisites,
    report a gap without claiming completion. Use only actual display_ref and host_event_ref via the configured
    trusted adapter/public key. Agent actor, unsigned JSON, decidedBy strings and silence cannot approve. Map only
    the actual CLI phase/data described by each exit condition; exit IDs are Workflow routing names, not invented
    ResultEnvelope phases.
  exits:
  - id: accepted
    label: accepted
    condition: status ok, phase approved and data.manual_review_ref names an authenticated accepted manual_review
      bound to display challenge, complete view, source/rules/tool identities.
    target: apply_view
  - id: stale
    label: stale
    condition: 'Display/view/event binding changed: prepare a fresh challenge.'
    target: prepare_confirmation
  - id: partial
    label: partial
    condition: 'Human event rejects or only partly accepts content (phase rejected, or explicit partial decision):
      require a new operation/view before any approval. Never narrow silently.'
    target: revise_candidate
  - id: awaiting_confirmation
    label: awaiting confirmation
    condition: 'status blocked, phase awaiting, missing authenticated bridge/event or genuine human action: stop
      awaiting confirmation; do not apply or mark success.'
    target: __end__
  - id: blocked
    label: blocked
    condition: 'Missing prerequisites or status blocked/error: end this attempt with an unresolved gap; no success,
      approval or publish claim.'
    target: __end__
- id: local_check
  title: Read-only code Claim checks
  type: skill
  owner: reviewer
  skill: hs-knowledge-local-check
  prompt: Use only the installed trusted catalog public CLI. Pass explicit operation_id and workflow run_id/node_id/attempt_id.
    Check ResultEnvelope status and phase and the actual immutable result JSON/Markdown manifest bindings; process
    exit 0 alone is not success. On every loop allocate a fresh attempt_id; changed content requires a new operation/view
    and approval. Do not forward the workflow object to helper Skills. Stop on errors or unresolved prerequisites,
    report a gap without claiming completion. Reject manual_document mode. Missing real code, current build or semantic
    evidence is incomplete, never zero-findings success. Do not alter card, links, lock, config or code. Map only
    the actual CLI phase/data described by each exit condition; exit IDs are Workflow routing names, not invented
    ResultEnvelope phases.
  exits:
  - id: code_passed
    label: code passed
    condition: status ok, phase passed and data.check_status passed; complete code_gate view and positive per-Claim
      evidence passed the read-only local check.
    target: apply_view
  - id: needs_revision
    label: needs revision
    condition: status ok, phase failed and data.check_status failed; explicit findings require a new candidate/view.
    target: revise_candidate
  - id: blocked
    label: blocked
    condition: 'Missing real code/build/semantic evidence, phase incomplete or data.check_status incomplete, or
      status blocked/error: stop with a gap. No zero-findings success.'
    target: __end__
- id: revise_candidate
  title: Revise and materialize a fresh candidate
  type: skill
  owner: coder
  skill: hs-knowledge-candidate-revise
  prompt: Use only the installed trusted catalog public CLI. Pass explicit operation_id and workflow run_id/node_id/attempt_id.
    Check ResultEnvelope status and phase and the actual immutable result JSON/Markdown manifest bindings; process
    exit 0 alone is not success. On every loop allocate a fresh attempt_id; changed content requires a new operation/view
    and approval. Do not forward the workflow object to helper Skills. Stop on errors or unresolved prerequisites,
    report a gap without claiming completion. Reuse public plan/materialize APIs without forwarding this node workflow
    identity. Preserve previous attempt artifacts; changes invalidate prior display/proof.
  exits:
  - id: ready
    label: ready
    condition: New operation/final_view records full candidate decisions and exact bytes; old approval is not reused.
    target: inspect_candidate
  - id: deferred
    label: deferred
    condition: Explicitly deferred with reasons and zero false stable claims.
    target: __end__
  - id: blocked
    label: blocked
    condition: 'Missing prerequisites or status blocked/error: end this attempt with an unresolved gap; no success,
      approval or publish claim.'
    target: __end__
- id: apply_view
  title: Apply approved exact bytes transactionally
  type: skill
  owner: coder
  skill: hs-knowledge-apply
  prompt: Use only the installed trusted catalog public CLI. Pass explicit operation_id and workflow run_id/node_id/attempt_id.
    Check ResultEnvelope status and phase and the actual immutable result JSON/Markdown manifest bindings; process
    exit 0 alone is not success. On every loop allocate a fresh attempt_id; changed content requires a new operation/view
    and approval. Do not forward the workflow object to helper Skills. Stop on errors or unresolved prerequisites,
    report a gap without claiming completion. Only verified proof authorizes stable application. Lock, persist backups/journal
    and use exact final bytes. Never repair source/card content silently. Committed reentry returns its original
    result. Map only the actual CLI phase/data described by each exit condition; exit IDs are Workflow routing names,
    not invented ResultEnvelope phases.
  exits:
  - id: applied
    label: applied
    condition: status ok, phase committed and data.apply_result_ref proves complete committed application of the
      exact view with verified human/local proof and successful whole-write-set CAS.
    target: rebuild_index
  - id: recovery_required
    label: recovery required
    condition: 'status blocked phase awaiting with nonterminal journal, interrupted write or explicit recovery_required:
      inspect/recover the existing transaction rather than repeating writes.'
    target: recover_transaction
  - id: stale
    label: stale
    condition: 'Expected baseline or proof changed: inspect/review a new view.'
    target: inspect_candidate
  - id: blocked
    label: blocked
    condition: 'Missing prerequisites or status blocked/error: end this attempt with an unresolved gap; no success,
      approval or publish claim.'
    target: __end__
- id: recover_transaction
  title: Inspect and recover the existing transaction
  type: skill
  owner: coder
  skill: hs-knowledge-recover
  prompt: Use only the installed trusted catalog public CLI. Pass explicit operation_id and workflow run_id/node_id/attempt_id.
    Check ResultEnvelope status and phase and the actual immutable result JSON/Markdown manifest bindings; process
    exit 0 alone is not success. On every loop allocate a fresh attempt_id; changed content requires a new operation/view
    and approval. Do not forward the workflow object to helper Skills. Stop on errors or unresolved prerequisites,
    report a gap without claiming completion. Invoke apply public recovery action. Conflict, inspect-only, blocked
    or partial state cannot take recovered. Preserve evidence and await resolution when unsafe. Map only the actual
    CLI phase/data described by each exit condition; exit IDs are Workflow routing names, not invented ResultEnvelope
    phases.
  exits:
  - id: recovered
    label: recovered
    condition: status ok, phase committed and data.apply_result_ref proves exact complete committed application;
      inspected alone is not recovered and cannot rebuild.
    target: rebuild_index
  - id: rolled_back
    label: rolled back
    condition: status ok, phase rolled_back; rollback completed without overwriting external edits. Require a new
      candidate.
    target: revise_candidate
  - id: blocked
    label: blocked
    condition: 'phase inspected, status blocked phase awaiting, conflict, incomplete journal or other unresolved
      prerequisite: stop for resolution without indexing or claiming committed recovery.'
    target: __end__
- id: rebuild_index
  title: Build an immutable candidate generation
  type: skill
  owner: coder
  skill: hs-knowledge-index-build
  prompt: Use only the installed trusted catalog public CLI. Pass explicit operation_id and workflow run_id/node_id/attempt_id.
    Check ResultEnvelope status and phase and the actual immutable result JSON/Markdown manifest bindings; process
    exit 0 alone is not success. On every loop allocate a fresh attempt_id; changed content requires a new operation/view
    and approval. Do not forward the workflow object to helper Skills. Stop on errors or unresolved prerequisites,
    report a gap without claiming completion. Use build, not implicit activation. On failure preserve old active
    generation. Do not go back to apply merely because indexing failed.
  exits:
  - id: built
    label: built
    condition: Candidate generation and exact same-generation card bytes are complete and verified; old active remains
      until regression/activation succeeds.
    target: query_regression
  - id: blocked
    label: blocked
    condition: 'Missing prerequisites or status blocked/error: end this attempt with an unresolved gap; no success,
      approval or publish claim.'
    target: __end__
- id: query_regression
  title: Verify candidate query behavior then activate
  type: skill
  owner: reviewer
  skill: hs-knowledge-query-regression
  prompt: Use only the installed trusted catalog public CLI. Pass explicit operation_id and workflow run_id/node_id/attempt_id.
    Check ResultEnvelope status and phase and the actual immutable result JSON/Markdown manifest bindings; process
    exit 0 alone is not success. On every loop allocate a fresh attempt_id; changed content requires a new operation/view
    and approval. Do not forward the workflow object to helper Skills. Stop on errors or unresolved prerequisites,
    report a gap without claiming completion. Reuse public query and index APIs; evaluation receipts are not shared
    user-read evidence. Regression/activation failure preserves old active and never repeats apply.
  exits:
  - id: checked
    label: checked
    condition: Declared query cases passed using the candidate generation and index activation CAS succeeded; actual
      activation proof exists.
    target: publish_handoff
  - id: blocked
    label: blocked
    condition: 'Missing prerequisites or status blocked/error: end this attempt with an unresolved gap; no success,
      approval or publish claim.'
    target: __end__
- id: publish_handoff
  title: Hand local result to external authorized publishing
  type: skill
  owner: coder
  skill: hs-knowledge-publish-handoff
  prompt: Use only the installed trusted catalog public CLI. Pass explicit operation_id and workflow run_id/node_id/attempt_id.
    Check ResultEnvelope status and phase and the actual immutable result JSON/Markdown manifest bindings; process
    exit 0 alone is not success. On every loop allocate a fresh attempt_id; changed content requires a new operation/view
    and approval. Do not forward the workflow object to helper Skills. Stop on errors or unresolved prerequisites,
    report a gap without claiming completion. End this template. G6-G9 Git publishing, latest-code merge check,
    committer identity and shared build belong to an authorized external process. Pure documents are exempt from
    code lint. Never commit/push from a node. Map only the actual CLI phase/data described by each exit condition;
    exit IDs are Workflow routing names, not invented ResultEnvelope phases.
  exits:
  - id: ready_to_publish
    label: ready to publish
    condition: status ok, phase awaiting_external_publish; actual local apply/index/regression identities and remaining
      external obligations are recorded. No Git merge, CI completion or shared publication is claimed.
    target: __end__
  - id: blocked
    label: blocked
    condition: 'Missing prerequisites or status blocked/error: end this attempt with an unresolved gap; no success,
      approval or publish claim.'
    target: __end__
artifacts:
  primary: []
  optional: []
